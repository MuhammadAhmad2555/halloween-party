<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ================================================================
     LINK PREVIEW (WhatsApp / Instagram / iMessage)
     These tags are read by link-preview robots, which do NOT run
     JavaScript, so edit them here by hand.
     If the site moves, replace https://muhammadahmad2555.github.io/halloween-party
     with your real site address (the image URL must be absolute).
     ================================================================ -->
<title>The Halloween Party · Saturday 31 October</title>
<meta name="description" content="You are summoned. Saturday 31 October, eight o'clock, Hollow House. Tap to open your invitation.">
<meta property="og:type" content="website">
<meta property="og:title" content="You are summoned to The Halloween Party">
<meta property="og:description" content="Saturday 31 October · eight o'clock in the evening · Hollow House. Tap to open your invitation.">
<meta property="og:url" content="https://muhammadahmad2555.github.io/halloween-party/">
<meta property="og:image" content="https://muhammadahmad2555.github.io/halloween-party/preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A gold tarot-style card with a death's-head moth inviting you to The Halloween Party">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1B1426">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B1426; --panel: #241A35; --cream: #F1E6D0; --ember: #E8834A;
    --gold: linear-gradient(120deg, #F6E1A6 0%, #C99B52 36%, #EFD08E 68%, #B98A45 100%);
    --gold-solid: #D9B46E;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--cream); background: radial-gradient(ellipse at 50% 0%, #3A2858 0%, var(--bg) 60%) no-repeat, var(--bg);
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.45;
    font-variant-ligatures: none; -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); text-align: center; }
  .cinzel { font-family: 'Cinzel', serif; font-style: normal; }
  .gold { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .card { position: relative; width: 100%; aspect-ratio: 1080 / 1512; border-radius: 6px; overflow: hidden;
    box-shadow: 0 0 50px rgba(232, 131, 74, .18), 0 18px 50px rgba(0, 0, 0, .55); background: var(--bg) url(poster.jpg) center / cover; }
  .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  .rule { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 30px auto; }
  .rule i { display: block; width: 90px; height: 1px; background: var(--gold-solid); opacity: .8; }
  .rule b { width: 12px; height: 12px; background: var(--gold); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }

  .eyebrow { margin: 34px 0 4px; font-size: 24px; }
  h1 { margin: 0; font-size: clamp(34px, 10vw, 48px); line-height: 1.08; letter-spacing: 2px; font-weight: 700; }

  .countdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 26px 0 6px; }
  .countdown div { border: 1px solid rgba(217, 180, 110, .55); padding: 14px 4px 10px; border-radius: 3px; background: rgba(36, 26, 53, .6); }
  .countdown strong { display: block; font-family: 'Cinzel', serif; font-style: normal; font-weight: 700; font-size: 34px; line-height: 1; }
  .countdown span { display: block; margin-top: 6px; font-family: 'Cinzel', serif; font-style: normal; font-size: 11px; letter-spacing: 3px; color: var(--cream); opacity: .8; }
  .countdown-note { min-height: 1.4em; margin: 6px 0 0; font-size: 18px; opacity: .85; }

  .details p { margin: 0 0 6px; }
  .details .date { font-family: 'Cinzel', serif; font-style: normal; font-weight: 700; font-size: 22px; letter-spacing: 3px; margin-top: 4px; }
  .details .place { font-family: 'Cinzel', serif; font-style: normal; font-weight: 600; font-size: 16px; letter-spacing: 2.5px; margin-top: 12px; }
  .details .addr { font-size: 18px; opacity: .85; }
  .details .note { color: var(--ember); margin-top: 12px; }

  .actions { display: grid; gap: 12px; margin-top: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 12px 18px; border-radius: 3px;
    font-family: 'Cinzel', serif; font-style: normal; font-weight: 700; font-size: 15px; letter-spacing: 2.5px; text-decoration: none; cursor: pointer;
    border: 1.5px solid var(--gold-solid); color: var(--cream); background: transparent; transition: background .2s, transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--gold); color: var(--bg); border-color: transparent; }
  .btn.ghost:hover { background: rgba(217, 180, 110, .1); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .rsvp-by { margin: 14px 0 0; font-size: 17px; opacity: .8; }
  footer { margin-top: 36px; font-family: 'Cinzel', serif; font-style: normal; font-size: 11px; letter-spacing: 3px; opacity: .5; }
  @media (prefers-reduced-motion: reduce) { .card video { display: none; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <video id="vid" autoplay muted loop playsinline preload="auto" poster="poster.jpg" aria-label="Animated invitation card">
      <source src="invitation.mp4" type="video/mp4">
    </video>
  </div>

  <p class="eyebrow">You are summoned to</p>
  <h1 class="cinzel gold" id="title">The Halloween Party</h1>

  <div class="countdown" role="timer" aria-live="off">
    <div><strong class="gold" id="cd-d">--</strong><span>DAYS</span></div>
    <div><strong class="gold" id="cd-h">--</strong><span>HOURS</span></div>
    <div><strong class="gold" id="cd-m">--</strong><span>MINUTES</span></div>
  </div>
  <p class="countdown-note" id="cd-note"></p>

  <div class="rule"><i></i><b></b><i></i></div>

  <section class="details">
    <p>you are summoned on</p>
    <p class="date" id="d-date"></p>
    <p id="d-time"></p>
    <p class="place" id="d-venue"></p>
    <p class="addr" id="d-address"></p>
    <p class="note" id="d-note"></p>
  </section>

  <div class="rule"><i></i><b></b><i></i></div>

  <section class="actions">
    <a class="btn primary" id="btn-yes" target="_blank" rel="noopener">I will attend</a>
    <a class="btn ghost" id="btn-no" target="_blank" rel="noopener">I cannot make it</a>
    <div class="actions">
      <button class="btn ghost" id="btn-cal" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Add to calendar</button>
      <a class="btn ghost" id="btn-map" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Directions</a>
    </div>
    <p class="rsvp-by" id="rsvp-by"></p>
  </section>

  <footer>XXXI</footer>
</main>

<script>
/* =====================================================================
   PARTY DETAILS: EDIT EVERYTHING HERE
   (Also update the <meta property="og:..."> tags at the top of this
   file, because link previews can't read this script.)
   ===================================================================== */
const PARTY = {
  title:      'The Halloween Party',
  dateText:   'Saturday, 31 October',
  timeText:   "at eight o'clock in the evening",
  venue:      'Hollow House',
  address:    '13 Raven Lane',
  note:       'costumes required, fortunes told at midnight',

  // Start and end in the party's local time: YYYY-MM-DDTHH:MM
  start:      '2026-10-31T20:00',
  end:        '2026-11-01T01:00',

  hostName:   'Maya',
  // >>> ADD THE HOST'S WHATSAPP NUMBER HERE <<<
  // Country code + number, digits only (no +, spaces or leading 0).
  // Example: Pakistan 0300 1234567 -> '923001234567'
  // Left empty, the RSVP buttons still work: WhatsApp asks the guest who to send it to.
  whatsapp:   '',

  // What Google Maps should search for (a full street address works best)
  mapsQuery:  'Hollow House, 13 Raven Lane',

  rsvpBy:     'Kindly reply by 24 October',
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
$('title').textContent = PARTY.title;
$('d-date').textContent = PARTY.dateText.toUpperCase();
$('d-time').textContent = PARTY.timeText;
$('d-venue').textContent = PARTY.venue.toUpperCase();
$('d-address').textContent = PARTY.address;
$('d-note').textContent = PARTY.note;
$('rsvp-by').textContent = PARTY.rsvpBy ? `${PARTY.rsvpBy}. Your reply goes to ${PARTY.hostName} on WhatsApp.` : '';

/* RSVP via WhatsApp */
const wa = text => `https://wa.me/${PARTY.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(text)}`; // empty number -> guest picks a chat
$('btn-yes').href = wa(`Hi ${PARTY.hostName}! 🕯️ I have received my summons and I WILL attend ${PARTY.title} on ${PARTY.dateText}. Name: `);
$('btn-no').href = wa(`Hi ${PARTY.hostName}, sadly I cannot make it to ${PARTY.title} on ${PARTY.dateText}. Have a wonderfully spooky night! 🦇`);

/* Directions */
$('btn-map').href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(PARTY.mapsQuery)}`;

/* Countdown (start time is treated as the guest's local time) */
const startAt = new Date(PARTY.start), endAt = new Date(PARTY.end);
function tick() {
  const now = new Date(), ms = startAt - now;
  if (ms <= 0) {
    ['cd-d', 'cd-h', 'cd-m'].forEach(id => $(id).textContent = '00');
    $('cd-note').textContent = now < endAt ? 'The summoning has begun.' : 'The night has passed. Thank you for coming.';
    return;
  }
  const m = Math.floor(ms / 60000);
  $('cd-d').textContent = String(Math.floor(m / 1440)).padStart(2, '0');
  $('cd-h').textContent = String(Math.floor(m / 60) % 24).padStart(2, '0');
  $('cd-m').textContent = String(m % 60).padStart(2, '0');
  $('cd-note').textContent = 'until the doors of Hollow House open';
}
tick(); setInterval(tick, 15000);

/* Add to calendar (.ics) */
function icsDate(s) { return s.replace(/[-:]/g, '') + '00'; } // floating local time
function icsEscape(s) { return s.replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n'); }
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hollow House//Halloween Invitation//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:halloween-${PARTY.start.replace(/\D/g, '')}@invitation`,
    `DTSTAMP:${stamp}`,
    `DTSTART:${icsDate(PARTY.start)}`,
    `DTEND:${icsDate(PARTY.end)}`,
    `SUMMARY:${icsEscape(PARTY.title)}`,
    `LOCATION:${icsEscape(PARTY.venue + ', ' + PARTY.address)}`,
    `DESCRIPTION:${icsEscape(PARTY.note + '\nRSVP to ' + PARTY.hostName + ' on WhatsApp.\n' + location.href)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT3H', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(PARTY.title)} tonight`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}
$('btn-cal').addEventListener('click', () => {
  const ics = buildICS();
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (iOS) { location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics); return; }
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'halloween-party.ics' });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

/* Some browsers block autoplay until a tap; the poster image stays as fallback */
const v = $('vid');
v.play && v.play().catch(() => document.addEventListener('touchstart', () => v.play().catch(() => {}), { once: true }));
</script>
</body>
</html>
