<style>
  :root { --bg: #0A0717; --cream: #F1E6D0; --soft: #E9DBC4; --ember: #E8834A; --line: rgba(241, 230, 208, .22); }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--cream); min-height: 100vh;
    background: radial-gradient(ellipse 120% 60% at 50% 0%, #2E1846 0%, var(--bg) 70%) no-repeat, var(--bg);
    font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 20px; line-height: 1.45;
    font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 520px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); text-align: center; }

  /* the card always fits the first screen on a phone */
  /* phones: the card fits the first screen; landscape phones never shrink below 280px */
  .hero { position: relative; margin: 0 auto; width: min(100%, max(280px, calc((100vh - 128px) * 9 / 16))); }
  @supports (height: 100svh) { .hero { width: min(100%, max(280px, calc((100svh - 128px) * 9 / 16))); } }
  .deck { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 18px; overscroll-behavior-x: contain;
    box-shadow: 0 0 60px rgba(232, 131, 74, .22), 0 20px 50px rgba(0, 0, 0, .6); }
  .deck::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; }
  .card { position: relative; aspect-ratio: 9 / 16; overflow: hidden; background: #05030A; cursor: zoom-in; -webkit-tap-highlight-color: transparent; }
  .expand { position: absolute; top: 12px; left: 12px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(241, 230, 208, .35);
    background: rgba(5, 3, 10, .45); color: var(--cream); display: grid; place-items: center; pointer-events: none; opacity: .8;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .expand svg { width: 16px; height: 16px; }
  .deck-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
  .nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(241, 230, 208, .35); background: rgba(10, 7, 23, .5); color: var(--cream);
    font: 22px/1 Georgia, serif; cursor: pointer; display: grid; place-items: center; padding: 0 0 3px; -webkit-tap-highlight-color: transparent; }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .dots { display: flex; gap: 10px; }
  .dot { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: rgba(241, 230, 208, .3); cursor: pointer; transition: .25s; }
  .dot[aria-current="true"] { background: var(--cream); transform: scale(1.25); box-shadow: 0 0 10px rgba(241, 230, 208, .6); }
  .deck-name { margin: 6px 0 0; font-size: 18px; color: var(--soft); min-height: 1.45em; }
  .card svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero-bar { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 4px; }
  .link-btn { background: none; border: 0; color: var(--soft); font: italic 500 18px 'Cormorant Garamond', serif; padding: 8px 4px; cursor: pointer; opacity: .85; text-decoration: none; }
  .link-btn:active { opacity: .6; }

  h1 { margin: 26px 0 0; font: 700 clamp(44px, 13vw, 60px)/1 'Grenze Gotisch', serif; color: #FFF0D6; text-shadow: 0 0 24px rgba(232, 131, 74, .6); }
  .eyebrow { margin: 14px 0 0; font-size: 22px; color: var(--soft); }

  .countdown { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 24px 0 0; }
  .countdown div { border: 1px solid var(--line); border-radius: 14px; padding: 14px 4px 12px; background: rgba(46, 24, 70, .35); }
  .countdown strong { display: block; font: 700 36px/1 'Cinzel', serif; color: #FFF0D6; }
  .countdown span { display: block; margin-top: 8px; font: 600 11px 'Cinzel', serif; letter-spacing: 3px; opacity: .75; }
  .cd-note { margin: 10px 0 0; font-size: 18px; color: var(--soft); min-height: 1.4em; }

  .divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 30px 0; }
  .divider i { width: 80px; height: 1px; background: var(--line); }
  .divider svg { width: 34px; height: 20px; fill: var(--cream); opacity: .9; }

  .details p { margin: 0 0 4px; }
  .details .date { font: 700 22px 'Cinzel', serif; letter-spacing: 3px; }
  .details .venue { font: 700 18px 'Cinzel', serif; letter-spacing: 4px; margin-top: 16px; }
  .details .soft { color: var(--soft); }
  .details .note { color: var(--ember); margin-top: 14px; font-weight: 600; }

  .actions { display: grid; gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 12px 18px; border-radius: 999px;
    font: 700 15px 'Cinzel', serif; letter-spacing: 2.5px; text-decoration: none; cursor: pointer; color: var(--cream);
    border: 1.5px solid rgba(241, 230, 208, .4); background: rgba(10, 7, 23, .6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); -webkit-tap-highlight-color: transparent; transition: transform .1s, background .2s; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: linear-gradient(180deg, #F29A5E, #D9692F); border-color: transparent; color: #1A0B06; box-shadow: 0 6px 24px rgba(232, 131, 74, .35); }
  .btn.ghost:hover { background: rgba(30, 20, 46, .75); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .two .btn { font-size: 12.5px; letter-spacing: 1.2px; padding: 12px 8px; gap: 7px; }
  .rsvp-by { margin: 16px 0 0; font-size: 17px; color: var(--soft); }
  footer { margin-top: 40px; font: 600 11px 'Cinzel', serif; letter-spacing: 4px; opacity: .45; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 40px); opacity: 0; transition: .3s;
    background: #F1E6D0; color: #1A0B06; padding: 10px 18px; border-radius: 999px; font: 600 13px 'Cinzel', serif; letter-spacing: 1px; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 700px) { main { padding-top: 32px; } }

  /* very small phones: stack the two half-width buttons */
  @media (max-width: 340px) { .two { grid-template-columns: 1fr; } .countdown strong { font-size: 30px; } }
  /* tablets in portrait: a bigger card and a wider column */
  @media (min-width: 600px) { main { max-width: 600px; } .hero { width: min(100%, max(320px, calc((100svh - 140px) * 9 / 16))); } }
  /* tablets in landscape, laptops, desktops: card on the left, details on the right */
  @media (min-width: 900px) and (orientation: landscape), (min-width: 1100px) {
    main { max-width: 1120px; display: grid; grid-template-columns: auto minmax(340px, 460px); column-gap: clamp(32px, 5vw, 80px);
      justify-content: center; align-items: start; }
    main > * { grid-column: 2; }
    main > .hero { grid-column: 1; grid-row: 1 / span 12; position: sticky; top: 20px; width: min(520px, calc((100vh - 150px) * 9 / 16)); }
    @supports (height: 100svh) { main > .hero { width: min(520px, calc((100svh - 150px) * 9 / 16)); } }
    main > h1 { margin-top: 40px; }
  }

  /* ---------- full-screen card ---------- */
  .viewer { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(46, 24, 70, .92), rgba(3, 2, 7, .98) 70%); touch-action: pan-y; }
  .viewer.open { display: flex; animation: vin .35s ease; }
  @keyframes vin { from { opacity: 0; } to { opacity: 1; } }
  .viewer-card { position: relative; aspect-ratio: 9 / 16; width: min(100vw, calc(100vh * 9 / 16)); overflow: hidden; background: #05030A;
    box-shadow: 0 0 80px rgba(0, 0, 0, .8); }
  @supports (height: 100dvh) { .viewer-card { width: min(100vw, calc(100dvh * 9 / 16)); } }
  @media (min-aspect-ratio: 9/16) { .viewer-card { border-radius: 14px; } }
  .viewer-card svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vbtn { position: absolute; z-index: 3; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(241, 230, 208, .35);
    background: rgba(5, 3, 10, .55); color: var(--cream); display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font: 26px/1 Georgia, serif; padding: 0; }
  .vbtn svg { width: 20px; height: 20px; }
  .vbtn:disabled { opacity: .25; cursor: default; }
  .v-close { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }
  .v-replay { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); }
  .v-prev, .v-next { top: 50%; transform: translateY(-50%); }
  .v-prev { left: max(10px, env(safe-area-inset-left)); } .v-next { right: max(10px, env(safe-area-inset-right)); }
  .v-label { position: absolute; z-index: 3; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); white-space: nowrap;
    padding: 6px 14px; border-radius: 999px; background: rgba(5, 3, 10, .55); color: var(--soft); font: italic 500 16px 'Cormorant Garamond', serif;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  body.viewing { overflow: hidden; }

  /* ---------- animated Halloween backdrop ---------- */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .webs, .graveyard { position: fixed; z-index: 0; pointer-events: none; }
  .web { position: fixed; top: 0; width: clamp(120px, 28vw, 240px); height: auto; opacity: .3; z-index: 0; pointer-events: none; }
  .web.l { left: 0; } .web.r { right: 0; transform: scaleX(-1); }
  .spider { position: fixed; top: 0; right: clamp(40px, 9vw, 80px); z-index: 0; pointer-events: none; animation: dangle 7s ease-in-out infinite; transform-origin: top center; }
  .spider svg { display: block; width: 34px; height: auto; }
  @keyframes dangle { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(70px) rotate(3deg); } 60% { transform: translateY(58px) rotate(-3deg); } }
  .graveyard { left: 0; right: 0; bottom: 0; height: clamp(80px, 12.5vw, 240px); transition: opacity .9s ease, transform .9s ease; }
  .graveyard svg { width: 100%; height: 100%; display: block; }
  .pk-face { animation: flicker 2.6s infinite; }
  .pk-face.b { animation-duration: 3.3s; animation-delay: -1s; }
  .pk-glow { animation: glowp 2.6s infinite; }
  @keyframes flicker { 0%, 100% { opacity: .95; } 20% { opacity: .7; } 22% { opacity: .9; } 50% { opacity: .78; } 70% { opacity: 1; } 72% { opacity: .65; } }
  @keyframes glowp { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
  main { position: relative; z-index: 1; padding-bottom: calc(clamp(80px, 12.5vw, 240px) + 20px + env(safe-area-inset-bottom)); }
  .toast { z-index: 2; }
  /* opening splash: hide the page until the moon-and-bats intro finishes */
  main { transition: opacity .9s ease, transform .9s ease; }
  body.splash main { opacity: 0; transform: translateY(16px); pointer-events: none; }
  body.splash { overflow: hidden; }
  body.splash .graveyard { opacity: 0; transform: translateY(30%); }
  @media (prefers-reduced-motion: reduce) { .spider, .pk-face, .pk-glow { animation: none; } }
</style>
</head>

<main>
  <div class="hero">
    <div class="deck" id="deck" aria-roledescription="carousel" aria-label="Invitation cards">
      <noscript><img src="invitation.jpg" alt="Invitation" style="width:100%;display:block"></noscript>
    </div>
    <div class="deck-nav">
      <button class="nav-btn" id="prev" type="button" aria-label="Previous card">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="next" type="button" aria-label="Next card">›</button>
    </div>
    <p class="deck-name" id="deck-name"></p>
    <div class="hero-bar">
      <button class="link-btn" id="replay" type="button">↻ replay the bats</button>
      <a class="link-btn" href="#details">details &amp; RSVP ↓</a>
    </div>
  </div>

  <h1 id="title"></h1>
  <p class="eyebrow">you are summoned</p>

  <div class="countdown" role="timer" aria-live="off">
    <div><strong id="cd-d">--</strong><span>DAYS</span></div>
    <div><strong id="cd-h">--</strong><span>HOURS</span></div>
    <div><strong id="cd-m">--</strong><span>MINUTES</span></div>
  </div>
  <p class="cd-note" id="cd-note"></p>

  <div class="divider"><i></i><svg viewBox="-55 -45 110 65"><path class="bat-icon"/></svg><i></i></div>

  <section class="details" id="details">
    <p class="date" id="d-date"></p>
    <p class="soft" id="d-time"></p>
    <p class="venue" id="d-venue"></p>
    <p class="soft" id="d-address"></p>
    <p class="note" id="d-note"></p>
  </section>

  <div class="divider"><i></i><svg viewBox="-55 -45 110 65"><path class="bat-icon"/></svg><i></i></div>

  <section class="actions">
    <a class="btn primary" id="btn-yes" target="_blank" rel="noopener">I will attend</a>
    <a class="btn ghost" id="btn-no" target="_blank" rel="noopener">I cannot make it</a>
    <div class="two">
      <button class="btn ghost" id="btn-cal" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Add to calendar</button>
      <a class="btn ghost" id="btn-map" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Directions</a>
    </div>
    <button class="btn ghost" id="btn-share" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Share invitation</button>
    <p class="rsvp-by" id="rsvp-by"></p>
  </section>

  <footer>HOLLOW HOUSE · XXXI · X</footer>
</main>
<div class="toast" id="toast">Link copied</div>

<script src="art.js"></script>
<script src="bg.js"></script>
<script src="intro.js"></script>
<script>
/* =====================================================================
   PARTY DETAILS: EDIT EVERYTHING HERE
   (Also update the <meta property="og:..."> tags at the top of this
   file, because link previews can't read this script.)
   ===================================================================== */
const PARTY = {
  title:      'The Halloween Party',
  dateText:   'Saturday, 31 October',
  timeText:   'from eight o’clock in the evening',
  venue:      'Hollow House',
  address:    '13 Raven Lane',
  note:       'costumes required · fortunes told at midnight',

  // Start and end in the party's local time: YYYY-MM-DDTHH:MM
  start:      '2026-10-31T20:00',
  end:        '2026-11-01T01:00',

  hostName:   'the host',
  // >>> HOST'S WHATSAPP NUMBER <<<
  // Country code + number, digits only (no +, spaces or leading 0).
  // Example: Pakistan 0300 1234567 -> '923001234567'
  // Left empty, the RSVP buttons still work: WhatsApp asks the guest who to send it to.
  whatsapp:   '923014761794',
  // How the number is printed on the card
  phoneShown: '0301 476 1794',

  // What Google Maps should search for (a full street address works best)
  mapsQuery:  'Hollow House, 13 Raven Lane',

  rsvpBy:     'Kindly reply by 24 October',
};
/* ===================================================================== */

const $ = id => document.getElementById(id);

/* ---------- the animated cards ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const titleLines = PARTY.title.match(/^(.*\S)\s+(\S+)$/) || [null, PARTY.title, ''];
const party = {
  title1: titleLines[1], title2: titleLines[2],
  date: PARTY.dateText.replace(',', ' ·').toUpperCase(),
  time: PARTY.timeText, venue: PARTY.venue.toUpperCase(), address: PARTY.address, note: PARTY.note,
  rsvpNumber: PARTY.phoneShown,
};
const DESCRIBE = {
  manor: 'bats burst from a full moon over a haunted manor',
  witch: 'a witch flies across a green moon above a bubbling cauldron',
  patch: 'a pumpkin-headed scarecrow in a glowing pumpkin patch',
  grave: 'ghosts rise behind an iron cemetery gate under a blue moon',
  vamp: 'a vampire castle on a cliff beneath a blood moon',
  forest: 'glowing eyes and an owl in a moonlit forest',
  ship: 'a ghost ship and a lighthouse on a moonlit sea',
  carnival: 'a turning Ferris wheel and circus tent at a haunted carnival',
};
const deck = $('deck');
// each slide builds its card the first time it is needed.
// clock: performance.now() at the card's t = 0 while it plays; at: its time while paused
const cards = HauntCard.THEMES.map((theme, i) => {
  const slide = document.createElement('div'); slide.className = 'slide';
  const box = document.createElement('div'); box.className = 'card';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'art'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', `Card ${i + 1}: ${DESCRIBE[theme] || HauntCard.themeNames[theme]}`);
  box.appendChild(svg); slide.appendChild(box); deck.appendChild(slide);
  box.insertAdjacentHTML('beforeend', '<span class="expand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span>');
  box.addEventListener('click', () => openViewer());
  box.setAttribute('tabindex', '0'); box.setAttribute('role', 'button'); box.setAttribute('aria-label', `Open card ${i + 1} full screen`);
  box.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(); } });
  return { theme, svg, card: null, clock: null, at: 6 };
});
function build(i) {
  const c = cards[i];
  if (c && !c.card) {
    c.card = HauntCard.create(c.svg, { theme: c.theme, lite: true, party });
    c.card.ready.then(() => { if (c.clock === null) c.card.setTime(c.at); });
  }
  return c;
}
let active = 0, visible = true, raf = 0, entered = false, viewing = false, shownIdx = -1;

function frame(now) {
  const c = cards[active];
  if (c.card) {
    if (c.clock === null) c.clock = now - c.at * 1000;
    c.card.setTime((now - c.clock) / 1000);
  }
  raf = visible ? requestAnimationFrame(frame) : 0;
}
function pause(c) { if (c.clock !== null) { c.at = (performance.now() - c.clock) / 1000; c.clock = null; } }
function run() { if (!reduceMotion && visible && entered && !raf) raf = requestAnimationFrame(frame); }

function moonOnScreen(c) {
  const r = c.svg.getBoundingClientRect(), m = c.card.moon;
  return [r.left + m.x * r.width, r.top + m.y * r.height];
}
function replay() {
  const c = build(active);
  c.clock = null; c.at = 0;
  run();
  PageIntro.play(...moonOnScreen(c));
}

/* carousel */
cards.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'dot'; b.type = 'button'; b.setAttribute('aria-label', HauntCard.themeNames[c.theme]);
  b.addEventListener('click', () => go(i));
  $('dots').appendChild(b);
});
function go(i) { deck.scrollTo({ left: i * deck.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' }); }
function setActive(i) {
  i = Math.max(0, Math.min(cards.length - 1, i));
  for (const k of [i - 1, i, i + 1]) build(k);
  if (i !== active) { pause(cards[active]); active = i; }
  document.querySelectorAll('.dot').forEach((d, k) => d.setAttribute('aria-current', k === i ? 'true' : 'false'));
  $('deck-name').textContent = `${HauntCard.themeNames[cards[i].theme]} · ${i + 1} of ${cards.length}`;
  $('prev').disabled = i === 0; $('next').disabled = i === cards.length - 1;
  if (viewing) showInViewer();
}
deck.addEventListener('scroll', () => setActive(Math.round(deck.scrollLeft / deck.clientWidth)), { passive: true });
$('prev').addEventListener('click', () => go(active - 1));
$('next').addEventListener('click', () => go(active + 1));

// ?card=witch (or a number) opens a particular card first
const want = new URLSearchParams(location.search).get('card');
const startIdx = Math.max(0, cards.findIndex((c, i) => c.theme === want || String(i + 1) === want));
active = startIdx;
setActive(startIdx);
if (startIdx) requestAnimationFrame(() => { deck.scrollLeft = startIdx * deck.clientWidth; });


/* ---------- full-screen viewer ---------- */
// The card's own <svg> moves into the viewer and back, so its animation keeps running.
const viewer = $('viewer'), vcard = $('viewer-card');
function homeOf(c) { return cards.indexOf(c) >= 0 ? deck.children[cards.indexOf(c) + (deck.children.length - cards.length)].firstChild : null; }
function showInViewer() {
  if (shownIdx >= 0 && shownIdx !== active) homeOf(cards[shownIdx]).prepend(cards[shownIdx].svg);
  const c = build(active);
  vcard.appendChild(c.svg);
  shownIdx = active;
  $('v-label').textContent = `${HauntCard.themeNames[c.theme]} · ${active + 1} of ${cards.length}`;
  $('v-prev').disabled = active === 0; $('v-next').disabled = active === cards.length - 1;
}
function openViewer() {
  if (viewing) return;
  viewing = true;
  document.body.classList.add('viewing');
  viewer.classList.add('open');
  showInViewer();
  visible = true; run();
  history.pushState({ viewer: 1 }, '');
  const fs = viewer.requestFullscreen || viewer.webkitRequestFullscreen;
  if (fs && !/iPhone|iPod/.test(navigator.userAgent)) { try { const p = fs.call(viewer); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
}
function closeViewer(fromHistory) {
  if (!viewing) return;
  viewing = false;
  if (shownIdx >= 0) homeOf(cards[shownIdx]).prepend(cards[shownIdx].svg);
  shownIdx = -1;
  viewer.classList.remove('open');
  document.body.classList.remove('viewing');
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  if (!fromHistory && history.state && history.state.viewer) history.back();
  deck.scrollLeft = active * deck.clientWidth;
}
function step(d) {
  const i = Math.max(0, Math.min(cards.length - 1, active + d));
  if (i === active) return;
  deck.scrollLeft = i * deck.clientWidth; // keeps the carousel in sync
  setActive(i);
}
$('v-close').addEventListener('click', () => closeViewer());
$('v-prev').addEventListener('click', () => step(-1));
$('v-next').addEventListener('click', () => step(1));
$('v-replay').addEventListener('click', replay);
window.addEventListener('popstate', () => closeViewer(true));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && viewing && !document.webkitFullscreenElement) { /* user left fullscreen with a system gesture; keep the overlay open */ } });
document.addEventListener('keydown', e => {
  if (!viewing) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
// swipe left/right to change card, swipe down to close
let sx = 0, sy = 0, st = 0;
viewer.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
viewer.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Date.now() - st > 800) return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) step(dx < 0 ? 1 : -1);
  else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5) closeViewer();
}, { passive: true });
// tap on the dark area around the card closes it
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });

/* opening: 5 seconds of moon, background and bats, then the page */
function enter() {
  document.body.classList.remove('splash');
  entered = true;
  const c = cards[active];
  if (!reduceMotion) { c.clock = null; c.at = 1.0; } // the card lights up and its text appears
  c.card.ready.then(run);
}
PageIntro.splash(5, enter);

$('replay').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(replay, window.scrollY > 40 ? 350 : 0);
});
if (reduceMotion) $('replay').style.visibility = 'hidden';
// pause the animation while the cards are off-screen to save battery
new IntersectionObserver(([e]) => {
  visible = e.isIntersecting || viewing;
  if (!visible) { pause(cards[active]); cancelAnimationFrame(raf); raf = 0; } else run();
}).observe(deck);

document.querySelectorAll('.bat-icon').forEach(p => p.setAttribute('d', HauntCard.batPath(0.5)));

/* ---------- text ---------- */
$('title').textContent = PARTY.title;
$('d-date').textContent = PARTY.dateText.toUpperCase();
$('d-time').textContent = PARTY.timeText;
$('d-venue').textContent = PARTY.venue.toUpperCase();
$('d-address').textContent = PARTY.address;
$('d-note').textContent = PARTY.note;
$('rsvp-by').textContent = PARTY.rsvpBy ? `${PARTY.rsvpBy}. Your reply goes to ${PARTY.hostName} on WhatsApp${PARTY.phoneShown ? ' (' + PARTY.phoneShown + ')' : ''}.` : '';

/* ---------- RSVP via WhatsApp ---------- */
const wa = text => `https://wa.me/${PARTY.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(text)}`; // empty number -> guest picks a chat
$('btn-yes').href = wa(`Hello! 🦇 I have received my summons and I WILL attend ${PARTY.title} on ${PARTY.dateText}. Name: `);
$('btn-no').href = wa(`Hello, sadly I cannot make it to ${PARTY.title} on ${PARTY.dateText}. Have a wonderfully spooky night! 🎃`);

/* ---------- directions ---------- */
$('btn-map').href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(PARTY.mapsQuery)}`;

/* ---------- countdown (start time is the guest's local time) ---------- */
const startAt = new Date(PARTY.start), endAt = new Date(PARTY.end);
function tick() {
  const now = new Date(), ms = startAt - now;
  if (ms <= 0) {
    ['cd-d', 'cd-h', 'cd-m'].forEach(id => $(id).textContent = '00');
    $('cd-note').textContent = now < endAt ? 'The summoning has begun.' : 'The night has passed. Thank you for coming.';
    return;
  }
  const m = Math.floor(ms / 60000);
  $('cd-d').textContent = String(Math.floor(m / 1440)).padStart(2, '0');
  $('cd-h').textContent = String(Math.floor(m / 60) % 24).padStart(2, '0');
  $('cd-m').textContent = String(m % 60).padStart(2, '0');
  $('cd-note').textContent = `until the doors of ${PARTY.venue} open`;
}
tick(); setInterval(tick, 15000);

/* ---------- add to calendar (.ics) ---------- */
const icsDate = s => s.replace(/[-:]/g, '') + '00'; // floating local time
const icsEscape = s => s.replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
function buildICS() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  return [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Hollow House//Halloween Invitation//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:halloween-${PARTY.start.replace(/\D/g, '')}@invitation`,
    `DTSTAMP:${stamp}`, `DTSTART:${icsDate(PARTY.start)}`, `DTEND:${icsDate(PARTY.end)}`,
    `SUMMARY:${icsEscape(PARTY.title)}`,
    `LOCATION:${icsEscape(PARTY.venue + ', ' + PARTY.address)}`,
    `DESCRIPTION:${icsEscape(PARTY.note + '\nRSVP on WhatsApp ' + PARTY.phoneShown + '\n' + location.href)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT3H', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(PARTY.title)} tonight`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}
$('btn-cal').addEventListener('click', () => {
  const ics = buildICS();
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (iOS) { location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics); return; }
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'halloween-party.ics' });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

/* ---------- share ---------- */
$('btn-share').addEventListener('click', async () => {
  const data = { title: PARTY.title, text: `You are summoned to ${PARTY.title} 🦇`, url: location.href.split('#')[0] };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.url);
    $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1800);
  } catch (e) { /* share sheet dismissed */ }
});
</script>
</body>
