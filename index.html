<style>
  :root { --bg: #0A0717; --cream: #F1E6D0; --soft: #E9DBC4; --ember: #E8834A; --line: rgba(241, 230, 208, .22); }
  * { box-sizing: border-box; }
  html { background-color: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--cream); min-height: 100vh;

  main { max-width: 520px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); text-align: center; }

  /* the card always fits the first screen on a phone */
  /* phones: the card fits the first screen; landscape phones never shrink below 280px */
  .hero { position: relative; margin: 0 auto; width: min(100%, max(280px, calc((100vh - 128px) * 9 / 16))); }
  @supports (height: 100svh) { .hero { width: min(100%, max(280px, calc((100svh - 128px) * 9 / 16))); } }
  .deck { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 18px; overscroll-behavior-x: contain;
    box-shadow: 0 0 60px rgba(232, 131, 74, .22), 0 20px 50px rgba(0, 0, 0, .6); }
  .deck::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always; }
  .card { position: relative; aspect-ratio: 9 / 16; overflow: hidden; background: #05030A; cursor: zoom-in; -webkit-tap-highlight-color: transparent; }

    background: rgba(5, 3, 10, .45); color: var(--cream); display: grid; place-items: center; pointer-events: none; opacity: .8;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .expand svg { width: 16px; height: 16px; }
  .deck-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
  .nav-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(241, 230, 208, .35); background: rgba(10, 7, 23, .5); color: var(--cream);
    font: 22px/1 Georgia, serif; cursor: pointer; display: grid; place-items: center; padding: 0 0 3px; -webkit-tap-highlight-color: transparent; }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .dots { display: flex; gap: 10px; }
  .dot { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: rgba(241, 230, 208, .3); cursor: pointer; transition: .25s; }
  .dot[aria-current="true"] { background: var(--cream); transform: scale(1.25); box-shadow: 0 0 10px rgba(241, 230, 208, .6); }
  .card svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* the page title takes the active card's typeface and glow */
  h1 { margin: 26px 0 0; font: var(--title-weight, 700) clamp(44px, 13vw, 60px)/1 var(--title-font, 'Grenze Gotisch'), serif; color: #FFF0D6;
    text-shadow: 0 0 24px var(--title-glow, rgba(232, 131, 74, .6)); transition: text-shadow .4s; }
  .eyebrow { margin: 14px 0 0; font-size: 22px; color: var(--soft); }

  .countdown div { border: 1px solid var(--line); border-radius: 14px; padding: 14px 4px 12px; background: rgba(46, 24, 70, .35); }

  @media (min-width: 700px) { main { padding-top: 32px; } }

  /* very small phones: stack the two half-width buttons */
  @media (max-width: 340px) { .countdown strong { font-size: 30px; } }
  /* tablets in portrait: a bigger card and a wider column */

  /* tablets in landscape, laptops, desktops: card on the left, details on the right */
  @media (min-width: 900px) and (orientation: landscape), (min-width: 1100px) {
    main { max-width: 1120px; display: grid; grid-template-columns: auto minmax(340px, 460px); column-gap: clamp(32px, 5vw, 80px);
      justify-content: center; align-items: start; }

    @supports (height: 100svh) { main > .hero { width: min(520px, calc((100svh - 150px) * 9 / 16)); } }
    /* title, countdown and footer sit centred beside the card */
    main > .info { grid-row: 1; align-self: center; }
    main > .info > h1 { margin-top: 0; }
  }

  /* ---------- full-screen card ---------- */
  .viewer { position: fixed; top: 0; left: 0; right: 0; height: 100vh; z-index: 45; display: none; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(46, 24, 70, .92), rgba(3, 2, 7, .98) 70%); touch-action: pan-y; }
  .viewer.open { display: flex; animation: vin .35s ease; }
  @keyframes vin { from { opacity: 0; } to { opacity: 1; } }
  /* the card's artwork fills the whole screen (it re-fits itself to the screen shape) */
  .viewer-card { position: absolute; inset: 0; overflow: hidden; background: #05030A; }
  @supports (height: 100lvh) {
    .viewer { height: 100lvh; }  /* reach behind mobile browser toolbars */
    .v-actions { margin-bottom: calc(100lvh - 100svh); }
  }
  .viewer-card svg.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .vbtn { position: absolute; z-index: 3; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(241, 230, 208, .35);
    background: rgba(5, 3, 10, .55); color: var(--cream); display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); font: 26px/1 Georgia, serif; padding: 0; }
  .vbtn svg { width: 20px; height: 20px; }
  .vbtn:disabled { opacity: .25; cursor: default; }
  .v-close { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); }
  .v-replay { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); }
  .v-prev, .v-next { top: 50%; transform: translateY(-50%); }
  .v-prev { left: max(10px, env(safe-area-inset-left)); } .v-next { right: max(10px, env(safe-area-inset-right)); }
  .v-label { position: absolute; z-index: 3; left: 50%; top: calc(max(14px, env(safe-area-inset-top)) + 10px); transform: translateX(-50%); white-space: nowrap;
    max-width: calc(100% - 140px); overflow: hidden; text-overflow: ellipsis; margin: 0;
    padding: 5px 14px; border-radius: 999px; background: rgba(5, 3, 10, .55); color: var(--soft); font: italic 500 16px 'Cormorant Garamond', serif;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  /* share / download / video */
  .v-actions { position: absolute; z-index: 3; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; padding: 6px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(28, 20, 44, .78), rgba(8, 5, 16, .82)); border: 1px solid rgba(241, 230, 208, .16);
    box-shadow: 0 14px 40px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 240, 214, .08);
    -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); max-width: calc(100% - 24px); }
  .v-act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 92px; height: 64px; padding: 0 12px;
    border: 0; border-radius: 18px; background: transparent; color: var(--cream); cursor: pointer; font: 700 10.5px 'Cinzel', serif; letter-spacing: 1.4px;
    -webkit-tap-highlight-color: transparent; white-space: nowrap; text-decoration: none; transition: background .2s, transform .1s, box-shadow .2s; }
  .v-act svg { width: 22px; height: 22px; color: var(--fab-accent, var(--ember)); transition: transform .2s; }
  .v-act:hover, .v-act:focus-visible { background: rgba(241, 230, 208, .09); }
  .v-act:hover svg { transform: translateY(-1px); }
  .v-act:focus-visible { outline: 2px solid rgba(241, 230, 208, .55); outline-offset: 2px; }
  .v-act:active { transform: scale(.96); }
  .v-act.primary { background: var(--fab-bg, linear-gradient(180deg, #F29A5E, #D9692F)); color: #1A0B06;
    box-shadow: 0 6px 20px var(--fab-glow, rgba(232, 131, 74, .45)), inset 0 1px 0 rgba(255, 245, 225, .35); }
  .v-act.primary svg { color: currentColor; }
  .v-act.primary:hover, .v-act.primary:focus-visible { background: var(--fab-bg, linear-gradient(180deg, #F29A5E, #D9692F)); filter: brightness(1.06); }
  .v-act[aria-busy="true"] { opacity: .6; pointer-events: none; }
  @media (max-width: 420px) {
    .v-actions { width: calc(100% - 20px); gap: 4px; padding: 5px; }
    .v-act { min-width: 0; padding: 0 4px; font-size: 9.5px; letter-spacing: .8px; }
  }
  /* edit the card text: a sheet over the card */
  .ed-wrap { position: absolute; inset: 0; z-index: 6; display: none; align-items: flex-end; justify-content: center;
    background: rgba(3, 2, 7, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .ed-wrap.open { display: flex; animation: vin .25s ease; }
  .editor { width: min(560px, 100%); max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; text-align: left;
    background: linear-gradient(180deg, rgba(30, 20, 48, .97), rgba(10, 7, 20, .98)); border: 1px solid rgba(241, 230, 208, .16); border-bottom: 0;
    box-shadow: 0 -20px 50px rgba(0, 0, 0, .5); color: var(--cream); }
  .editor h2 { margin: 0; text-align: center; font: var(--title-weight, 700) 30px/1.1 var(--title-font, 'Grenze Gotisch'), serif; color: #FFF0D6; }
  .ed-sub { margin: 6px 0 16px; text-align: center; font-size: 16px; color: var(--soft); }
  .ed-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  .ed-field { display: block; min-width: 0; }
  .ed-eyebrow, .ed-date, .ed-time, .ed-note { grid-column: 1 / -1; }
  .ed-field span { display: block; margin: 0 0 6px 4px; font: 600 10px 'Cinzel', serif; letter-spacing: 2px; text-transform: uppercase; opacity: .8; }
  .ed-field input { width: 100%; border-radius: 12px; border: 1.5px solid rgba(241, 230, 208, .28); background: rgba(5, 3, 10, .6); color: var(--cream);
    font: italic 500 18px 'Cormorant Garamond', Georgia, serif; padding: 11px 13px; outline: none; -webkit-appearance: none; appearance: none; }
  .ed-field input:focus { border-color: var(--fab-accent, var(--ember)); box-shadow: 0 0 0 3px rgba(232, 131, 74, .18); }
  .ed-msg { min-height: 1.3em; margin: 12px 0 0; text-align: center; font-size: 15px; color: var(--soft); }
  .ed-btns { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-top: 10px; }
  .ed-btn { min-height: 50px; border-radius: 999px; border: 1.5px solid rgba(241, 230, 208, .3); background: rgba(5, 3, 10, .5); color: var(--cream);
    font: 700 12px 'Cinzel', serif; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .ed-btn:active { transform: scale(.97); }
  .ed-btn:disabled { opacity: .55; cursor: default; }
  .ed-btn.primary { border-color: transparent; color: #1A0B06; background: var(--fab-bg, linear-gradient(180deg, #F29A5E, #D9692F));
    box-shadow: 0 6px 20px var(--fab-glow, rgba(232, 131, 74, .4)); }
  @media (max-width: 380px) { .ed-fields { grid-template-columns: 1fr; } }
  @media (min-width: 700px) { .ed-wrap { align-items: center; } .editor { border-radius: 26px; border-bottom: 1px solid rgba(241, 230, 208, .16); padding-bottom: 20px; } }
  body.viewing { overflow: hidden; }
  /* card-only page opened from a shared link: no password, no dashboard */
  body.invite main, body.invite .graveyard, body.invite .gate { display: none !important; }
  body.invite .vbtn, body.invite .v-label, body.invite .v-actions { display: none !important; }
  #act-rsvp { display: none; }
  body.invite #act-rsvp { display: flex; }
  body.invite #act-video { background: transparent; color: var(--cream); box-shadow: none; }
  body.invite #act-video svg { color: var(--fab-accent, var(--ember)); }

  /* ---------- floating RSVP button on shared card links ---------- */
  .fab-wrap { display: none; }
  body.invite .fab-wrap { display: block; }
  .fab-scrim { position: fixed; inset: 0; z-index: 58; background: rgba(3, 2, 7, .45); opacity: 0; pointer-events: none; transition: opacity .25s;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .fab-wrap.open .fab-scrim { opacity: 1; pointer-events: auto; }
  .fab { position: fixed; z-index: 60; right: max(18px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 22px 0 18px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--fab-bg, linear-gradient(180deg, #F29A5E, #D9692F)); color: #120A06; font: var(--title-weight, 700) 17px var(--title-font, 'Cinzel'), serif; letter-spacing: 1.5px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 220, 180, .25) inset, 0 0 26px var(--fab-glow, rgba(232, 131, 74, .45));
    -webkit-tap-highlight-color: transparent; opacity: 0; transform: translateY(20px) scale(.9); pointer-events: none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .9, .3, 1.3); }
  .fab-wrap.ready .fab { opacity: 1; transform: none; pointer-events: auto; }

  .fab .x { display: none; }
  .fab-wrap.open .fab .x { display: block; } .fab-wrap.open .fab .m { display: none; }
  .fab-wrap.ready:not(.open) .fab { animation: fabpulse 2.6s ease-in-out 1s infinite; }
  @keyframes fabpulse { 50% { box-shadow: 0 8px 30px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 220, 180, .25) inset, 0 0 46px var(--fab-glow, rgba(232, 131, 74, .8)); } }
  .fab-menu { position: fixed; z-index: 59; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 72px);
    display: grid; gap: 10px; justify-items: end; pointer-events: none; }
  .fab-item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 20px 0 16px; border-radius: 999px; text-decoration: none; cursor: pointer;
    background: rgba(14, 9, 26, .9); color: var(--cream); border: 1px solid rgba(241, 230, 208, .25); font: var(--title-weight, 700) 16px var(--title-font, 'Cinzel'), serif; letter-spacing: 1px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); -webkit-tap-highlight-color: transparent;
    opacity: 0; transform: translateY(16px) scale(.95); transition: opacity .22s ease, transform .22s ease; white-space: nowrap; }
  .fab-item svg { width: 20px; height: 20px; flex: none; }
  .fab-item.yes { background: var(--fab-bg, linear-gradient(180deg, #F29A5E, #D9692F)); color: #120A06; border-color: transparent; }
  .fab-item svg { color: var(--fab-accent, currentColor); } .fab-item.yes svg { color: currentColor; }
  .fab-wrap.open .fab-menu { pointer-events: auto; }
  .fab-wrap.open .fab-item { opacity: 1; transform: none; }
  .fab-wrap.open .fab-item:nth-child(3) { transition-delay: .04s; } .fab-wrap.open .fab-item:nth-child(2) { transition-delay: .08s; }
  .fab-wrap.open .fab-item:nth-child(1) { transition-delay: .12s; }
  .fab-item:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { .fab, .fab-item { transition: none; } .fab-wrap.ready:not(.open) .fab { animation: none; } }

  /* ---------- animated Halloween backdrop ---------- */
  /* the night-sky glow lives on the fixed backdrop; its edges are pure --bg so phone bars blend in */
  #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse 140% 70% at 50% 42%, #2A1642 0%, #160D27 30%, var(--bg) 56%) var(--bg); }
  @supports (height: 100lvh) { #bg { height: 100lvh; } }
  .webs, .graveyard { position: fixed; z-index: 0; pointer-events: none; }
  .web { position: fixed; top: 0; width: clamp(120px, 28vw, 240px); height: auto; opacity: .3; z-index: 0; pointer-events: none; }
  .web.l { left: 0; } .web.r { right: 0; transform: scaleX(-1); }
  .spider { position: fixed; top: 0; right: clamp(40px, 9vw, 80px); z-index: 0; pointer-events: none; animation: dangle 7s ease-in-out infinite; transform-origin: top center; }
  .spider svg { display: block; width: 34px; height: auto; }
  @keyframes dangle { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(70px) rotate(3deg); } 60% { transform: translateY(58px) rotate(-3deg); } }
  .graveyard { left: 0; right: 0; bottom: 0; height: clamp(80px, 12.5vw, 240px); transition: opacity .9s ease, transform .9s ease; }
  .graveyard svg { width: 100%; height: 100%; display: block; }
  .pk-face { animation: flicker 2.6s infinite; }
  .pk-face.b { animation-duration: 3.3s; animation-delay: -1s; }
  .pk-glow { animation: glowp 2.6s infinite; }
  @keyframes flicker { 0%, 100% { opacity: .95; } 20% { opacity: .7; } 22% { opacity: .9; } 50% { opacity: .78; } 70% { opacity: 1; } 72% { opacity: .65; } }
  @keyframes glowp { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
  main { position: relative; z-index: 1; padding-bottom: calc(clamp(80px, 12.5vw, 240px) + 20px + env(safe-area-inset-bottom)); }
  .toast { z-index: 90; }
  /* opening splash: hide the page until the moon-and-bats intro finishes */
  main { transition: opacity .9s ease, transform .9s ease; }
  body.splash main { opacity: 0; transform: translateY(16px); pointer-events: none; }
  body.splash { overflow: hidden; }

  /* ---------- password gate ---------- */
  .gate { position: fixed; top: 0; left: 0; right: 0; height: 100vh; z-index: 80; display: none; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); text-align: center;

<script>
/* =====================================================================
   PARTY DETAILS: EDIT EVERYTHING HERE
   (Also update the <meta property="og:..."> tags at the top of this
   file, because link previews can't read this script.)
   Phone, venue, and maps below are defaults only. When a customer
   public id is present (?c=…), Firebase publicInvites overrides them.
   ===================================================================== */
const PARTY = {
  title:      'The Halloween Party',
  dateText:   'Saturday, 31 October',
  timeText:   'from eight o’clock in the evening',
  venue:      'Hollow House',
  address:    '13 Raven Lane',
  note:       'costumes required · fortunes told at midnight',

  // Start and end in the party's local time: YYYY-MM-DDTHH:MM
  start:      '2026-10-31T20:00',
  end:        '2026-11-01T01:00',

  hostName:   'the host',
  // >>> HOST'S WHATSAPP NUMBER <<<
  // Country code + number, digits only (no +, spaces or leading 0).
  // Example: Pakistan 0300 1234567 -> '923001234567'
  // Left empty, the RSVP buttons still work: WhatsApp asks the guest who to send it to.
  whatsapp:   '923014761794',
  // How the number is printed on the card
  phoneShown: '0301 476 1794',

  // What Google Maps should search for (a full street address works best)
  mapsQuery:  'Hollow House, 13 Raven Lane',

  rsvpBy:     'Kindly reply by 24 October',
};
/* ===================================================================== */

window.__HP_PUBLIC_ID__ = '';

(async function bootHalloween() {
  const params = new URLSearchParams(location.search);
  let publicId = (params.get('c') || '').trim();
  // Host studio: reuse the public id remembered after dashboard login.
  // Guest invite links always carry ?c= themselves; do not invent one.
  if (!publicId && !params.get('invite')) {
    try { publicId = (sessionStorage.getItem('hp_publicId') || '').trim(); } catch (e) {}
  }
  window.__HP_PUBLIC_ID__ = publicId;
  const cfg = window.FIREBASE_CONFIG;
  const configured = cfg && cfg.apiKey && !String(cfg.apiKey).startsWith('YOUR_');
  if (publicId && configured && window.HalloweenCustomer) {
    try {
      HalloweenCustomer.ensureApp();
      await HalloweenCustomer.applyPublicInvite(PARTY, publicId);
    } catch (e) {
      console.warn('Halloween customer data could not be loaded.', e);
    }
  }
  startHalloweenApp();
})();

function startHalloweenApp() {
const $ = id => document.getElementById(id);

/* ---------- the animated cards ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const titleLines = PARTY.title.match(/^(.*\S)\s+(\S+)$/) || [null, PARTY.title, ''];
// what the cards say until the host edits them (the ready-made files in cards/ match this)
const DEFAULT_TEXT = {
  eyebrow: 'YOU ARE SUMMONED TO',
  title1: titleLines[1], title2: titleLines[2],
  date: PARTY.dateText.replace(',', ' ·').toUpperCase(),
  time: PARTY.timeText, venue: PARTY.venue.toUpperCase(), address: PARTY.address, note: PARTY.note,
};
const TEXT_KEYS = Object.keys(DEFAULT_TEXT);
const LOCAL_TEXT = 'hp_cardText';
const BASE_TITLE = PARTY.title, BASE_VENUE = PARTY.venue;
function pickText(t) {
  const out = {};
  for (const k of TEXT_KEYS) if (t && typeof t[k] === 'string') out[k] = t[k];
  return out;
}
// the host's edits: from their invite record (also what guests see), else saved on this device
function savedText() {
  if (PARTY.cardText) return pickText(PARTY.cardText);
  if (document.body.classList.contains('invite')) return {};
  try { return pickText(JSON.parse(localStorage.getItem(LOCAL_TEXT) || '{}')); } catch (e) { return {}; }
}
let party = { ...DEFAULT_TEXT, ...savedText(), rsvpNumber: PARTY.phoneShown };
const textEdited = () => TEXT_KEYS.some(k => party[k] !== DEFAULT_TEXT[k]);
// the page title, messages and countdown follow the card's title and venue
function syncPageText() {
  PARTY.title = `${party.title1} ${party.title2}`.trim() || BASE_TITLE;
  PARTY.venue = party.venue === DEFAULT_TEXT.venue ? BASE_VENUE : party.venue || BASE_VENUE;
  $('title').textContent = PARTY.title;
}
syncPageText();
const DESCRIBE = {
  manor: 'bats burst from a full moon over a haunted manor',
  witch: 'a witch flies across a green moon above a bubbling cauldron',
  patch: 'a pumpkin-headed scarecrow in a glowing pumpkin patch',
  grave: 'ghosts rise behind an iron cemetery gate under a blue moon',
  vamp: 'a vampire castle on a cliff beneath a blood moon',
  forest: 'glowing eyes and an owl in a moonlit forest',
  ship: 'a ghost ship and a lighthouse on a moonlit sea',
  carnival: 'a turning Ferris wheel and circus tent at a haunted carnival',
};
const deck = $('deck');
// each slide builds its card the first time it is needed.
// clock: performance.now() at the card's t = 0 while it plays; at: its time while paused
const cards = HauntCard.THEMES.map((theme, i) => {
  const slide = document.createElement('div'); slide.className = 'slide';
  const box = document.createElement('div'); box.className = 'card';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'art'); svg.setAttribute('role', 'img');

  const got = hex(bits);
  let diff = 0;

    `LOCATION:${icsEscape(PARTY.venue + ', ' + PARTY.address)}`,
    `DESCRIPTION:${icsEscape(PARTY.note + '\nRSVP on WhatsApp ' + PARTY.phoneShown + '\n' + location.href)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT3H', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(PARTY.title)} tonight`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
}
function addToCalendar() {
  const ics = buildICS();
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (iOS) { location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics); return; }
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'halloween-party.ics' });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
} // end startHalloweenApp
</script>
